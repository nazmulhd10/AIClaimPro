<!doctype html>
<html lang="en">
  <head>
    {% include "partials/header.html" %}
    <title>{% block title %}AI Claim Pro Dashboard{% endblock %}</title>
    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1;
      }
      .sidebar {
        height: 100vh;
        position: sticky;
        top: 0;
        padding-top: 1rem;
      }
      .nav-link:hover {
        background-color:rgb(10, 61, 19);
        color: white;
        font-weight: bold;
      }
      .table td, .table th {
        vertical-align: middle;
      }
    </style>
  </head>
  <body class="bg-light">

    {% include "partials/top_navbar.html" %}

    <main class="container-fluid">
      <div class="row">
        {% include "partials/left_sidebar.html" %}
        <div class="col-md-8 ms-sm-auto col-lg-9 px-md-4 pt-4">
          {% block content %}{% endblock %}
        </div>
      </div>
    </main>

    {% include "partials/footer.html" %}

    {% block scripts %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
